services:
  wp-server:
    image: woodpeckerci/woodpecker-server:v3
    container_name: wp-server
    ports:
      - 8000:8000
    volumes:
      - wp-server-data:/var/lib/woodpecker/
    environment:
      - WOODPECKER_OPEN=true
      - WOODPECKER_ADMIN=hesangang
      - WOODPECKER_HOST=${WOODPECKER_HOST}
      - WOODPECKER_ROOT_PATH=/wps
      - WOODPECKER_GITHUB=true
      - WOODPECKER_GITHUB_CLIENT=${WOODPECKER_GITHUB_CLIENT}
      - WOODPECKER_GITHUB_SECRET=${WOODPECKER_GITHUB_SECRET}
      - WOODPECKER_AGENT_SECRET=${WOODPECKER_AGENT_SECRET}
    networks:
      - net

  wp-agent:
    image: woodpeckerci/woodpecker-agent:v3
    container_name: wp-agent
    command: agent
    restart: always
    depends_on:
      - wp-server
    volumes:
      - wp-agent-config:/etc/woodpecker
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - WOODPECKER_SERVER=wp-server:9000
      - WOODPECKER_AGENT_SECRET=${WOODPECKER_AGENT_SECRET}
    networks:
      - net

volumes:
  wp-server-data:
  wp-agent-config:

networks:
  net:
    external: true
    name: tfwk-net



