services:
  frpc:
    image: stilleshan/frpc:0.51.3
    container_name: frpc
    restart: always
    volumes:
      - ./frpc.ini:/frp/frpc.ini
    healthcheck:
      test: ["CMD", "pgrep", "frpc"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - net

networks:
  net:
    external: true
    name: my-net
