events {
}

http {
    # 添加这行，告诉 nginx 使用 docker 默认的 DNS
    resolver 127.0.0.11 valid=10s;

    server {
        listen       80;
        server_name  localhost;

        location /api/ {
            set $backend http://api-service:8080;
            proxy_pass $backend/;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;

            proxy_connect_timeout 5s;
            proxy_read_timeout 10s;
        }

        location /admin/ {
            set $backend http://admin-service:8081/;
            proxy_pass $backend;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;

            proxy_connect_timeout 5s;
            proxy_read_timeout 10s;
        }

        location / {
            set $backend http://app-service:80/;
            proxy_pass $backend;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;

            proxy_connect_timeout 5s;
            proxy_read_timeout 10s;
        }
    }
}
 