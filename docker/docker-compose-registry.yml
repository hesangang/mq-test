services:
  registry:
    image: registry:2
    container_name: registry
    ports:
      - "5000:5000"
    restart: always
    environment:
      REGISTRY_HTTP_ADDR: :5000
    volumes:
      - registry_data:/var/lib/registry
    networks:
      - net

volumes:
  registry_data:

networks:
  net:
    external: true
    name: my-net



