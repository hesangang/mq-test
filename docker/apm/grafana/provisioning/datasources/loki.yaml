apiVersion: 1

datasources:
  - name: Loki
    uid: 'Loki'
    type: loki
    access: proxy
    url: http://loki:3100
    isDefault: true
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: false
  - name: Tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    isDefault: false
    jsonData:
      httpMethod: GET
      tracesToLogsV2:
        datasourceUid: 'Loki'
        spanStartTimeShift: '5m'
        spanEndTimeShift: '5m'
        tags: ['job', 'instance', 'level']
        filterByTraceID: true
        filterBySpanID: false
        customQuery: true
        query: '{traceID="$traceID"}'
      lokiSearch:
        datasourceUid: 'Loki'
      nodeGraph:
        enabled: true
      search:
        hide: false
      serviceMap:
        hide: false