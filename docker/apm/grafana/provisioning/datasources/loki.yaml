apiVersion: 1

datasources:
  - name: Loki
    uid: 'loki'
    type: loki
    access: proxy
    url: http://loki:3100
    isDefault: false

  - name: Prometheus
    uid: 'prometheus'
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true

  - name: Tempo
    uid: 'tempo'
    type: tempo
    access: proxy
    url: http://tempo:3200
    isDefault: false
    jsonData:
      httpMethod: GET
      tracesToLogsV2:
        datasourceUid: 'loki'
        spanStartTimeShift: '5m'
        spanEndTimeShift: '5m'
        tags: ['job', 'instance']
        filterByTraceID: true
        filterBySpanID: false
        customQuery: true
        query: '{traceId=\"$traceID\"}'
      lokiSearch:
        datasourceUid: 'loki'
      nodeGraph:
        enabled: true
      search:
        hide: false
      serviceMap:
        hide: false
